name: SEO research

# Research-only pipeline: retrieve DataForSEO keyword/SERP data, Reddit
# insights and Google Search Console results, then publish the brief in the
# job logs, the step summary and a downloadable artifact. No article is
# written and no PR is opened — use seo-blog.yml for the full flow.
#
# Trigger it from the Actions tab or via the API (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cross-run memory for the credit-costing DataForSEO results.
      # Restored BEFORE the pipeline runs and immune to git push failures
      # (branch protection, push races, rebase conflicts), so pipeline/data
      # survives even when the persist push doesn't and the next run reuses
      # it instead of re-paying DataForSEO. The unique key never pre-exists,
      # so the cache is always re-saved at the end; restore-keys pulls the
      # most recent previous cache.
      - name: Restore SEO data cache (candidates + SERP cache)
        uses: actions/cache@v4
        with:
          path: pipeline/data
          key: seo-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seo-data-

      - name: Install pipeline dependencies
        run: cd pipeline && npm install

      - name: Run SEO research (keywords + topic + Reddit + GSC)
        env:
          # DataForSEO — ready-made base64 of "login:password" (required)
          DATAFORSEO_BASE64: ${{ secrets.DATAFORSEO_BASE64 }}
          # Reddit — optional (step is skipped if unset)
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: growth/0.1 (seo-research workflow)
          # Google Search Console — optional, service-account JSON
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
          # Accept the value whether it's stored as a GitHub Actions secret or
          # as a repository/org variable (secret wins if both are set).
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || vars.GSC_SITE_URL }}
          DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
        run: cd pipeline && npm run morning

      # Print the outputs in the logs so they can be read through the API
      # (job logs), not just from the artifact.
      - name: Print research outputs to logs
        if: always()
        run: |
          for f in morning-report.md today-topic.json; do
            echo "===== BEGIN pipeline/out/$f ====="
            cat "pipeline/out/$f" 2>/dev/null || echo "(missing)"
            echo "===== END pipeline/out/$f ====="
          done

      - name: Post research brief to step summary
        if: always()
        run: cat pipeline/out/morning-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-research-out
          path: |
            pipeline/out/
            pipeline/data/

      # pipeline/data/ holds everything that costs DataForSEO credits
      # (candidates.json, serp-cache). Commit it back so the next run —
      # CI checkouts are fresh — reuses it instead of paying again.
      - name: Persist research data (candidates + SERP cache)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data || true
          if git diff --cached --quiet; then
            echo "No research data changes to persist."
            exit 0
          fi
          git commit -m "chore(seo): refresh research data [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
