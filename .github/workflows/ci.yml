name: CI

# One pipeline for a change's whole life: prove it, then ship it.
#
#   checks ─┐
#           ├─► mirror   (public repo)
#   e2e   ──┘
#           └─► deploy   (ECR → ECS)
#
# Mirroring and deploying used to be separate workflows triggered by the same
# push as CI, which meant they raced it: a commit could be on the public repo and
# in production before the suite that would have rejected it had finished. They
# are `needs:`-gated behind the checks now, so `main` cannot ship red.
#
# The tests require no external services — those that need a database boot an
# ephemeral PostgreSQL in-process (PGlite), so there is no `services:` block and
# nothing to keep in sync with production credentials.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Also mirror and deploy (main only). Off = checks alone."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull-request run is wasted work, so drop it. On main the run can
  # deploy, so it is queued rather than cancelled: killing a run midway could
  # leave an image pushed to ECR with no service update behind it, and two
  # concurrent runs could push their images out of order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated into node_modules/.prisma, so it must be
      # built before anything type-checks or imports it.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Boots PGlite + the app's custom server (see tests/e2e/serve.ts) and drives
      # two browser contexts through a shared transcript.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --- Release. Only on main, only once the checks above are green. ------------
  # A manual run is checks-only unless `release` is ticked, so re-running the
  # suite on main never publishes or deploys as a side effect.

  mirror:
    name: Mirror to public repo
    needs: [checks, e2e]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Remove private content
        run: |
          PRIVATE_PATHS=(
            "app/(landing)"
            "app/sitemap.ts"
            "public/landing"
            ".github/workflows"
            "content/blog"
            "growth"
            "pipeline"
            ".claude"
            ".vscode"
          )

          CHANGED=false
          for path in "${PRIVATE_PATHS[@]}"; do
            if [ -e "$path" ]; then
              git rm -rf --cached "$path"
              rm -rf "$path"
              CHANGED=true
            fi
          done

          if [ "$CHANGED" = true ]; then
            git commit -m "chore: strip private content for public mirror"
          fi

      - name: Push to public repo
        env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          # actions/checkout injects a GITHUB_TOKEN extraheader that overrides
          # any credentials in the URL — unset it so the PAT takes effect.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote add public https://x-access-token:${PUBLIC_REPO_PAT}@github.com/humanlogs/humanlogs.app.git
          git push public HEAD:main --force

  deploy:
    name: Deploy backend to ECS
    needs: [checks, e2e]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image carries a full node_modules twice (builder + runner) plus
      # ffmpeg, and the runner ships ~30 GB of toolchains this build never
      # touches. Reclaiming them keeps the build off the disk ceiling.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Log in to AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clean AI artifacts from blog content
        run: node pipeline/clean-ai-artifacts.mjs content/blog/*

      # Built straight to ECR: `--load` used to materialise the image in the
      # local daemon first (a ~1.5 GB tarball export, then a second copy in the
      # daemon's store) only for a `docker push` to read it back.
      #
      # The layer cache lives in the GitHub Actions cache, not on the runner's
      # disk. The previous local cache was restored to /tmp/.buildx-cache and
      # re-exported to /tmp/.buildx-cache-new, so both generations sat on disk
      # at once — and, since the export is additive over what was restored, the
      # cache grew with every push to main until the export ran out of space.
      # That is what has been failing this job since 21/08. An export failure is
      # not worth failing a deploy over either, hence ignore-error.
      - name: Build and push Docker image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Clean up old ECR images
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Keep the latest 5 images and delete the rest
          IMAGES_TO_DELETE=$(aws ecr list-images --repository-name ${{ secrets.ECR_REPOSITORY }} --query 'imageIds[?type(imageTag)!=`string`].[imageDigest]' --output text)
          if [ ! -z "$IMAGES_TO_DELETE" ]; then
            aws ecr batch-delete-image --repository-name ${{ secrets.ECR_REPOSITORY }} --image-ids $(echo $IMAGES_TO_DELETE | sed 's/\s\+/,/g' | sed 's/^/imageDigest=/g' | sed 's/,/ imageDigest=/g')
          fi

          # Keep only the 5 most recent tagged images
          IMAGES_TO_DELETE=$(aws ecr list-images --repository-name ${{ secrets.ECR_REPOSITORY }} --filter tagStatus=TAGGED --query 'imageIds[:-5].[imageDigest, imageTag]' --output text)
          if [ ! -z "$IMAGES_TO_DELETE" ]; then
            aws ecr batch-delete-image --repository-name ${{ secrets.ECR_REPOSITORY }} --image-ids $(echo "$IMAGES_TO_DELETE" | awk '{printf "imageDigest=%s,imageTag=%s ", $1, $2}')
          fi
