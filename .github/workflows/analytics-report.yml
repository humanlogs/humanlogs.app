name: Analytics Report

# Manual trigger only — run from GitHub Actions tab → "Run workflow"
on:
  workflow_dispatch: {}

jobs:
  analytics-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: growth/package-lock.json

      - run: npm ci

      - name: Run analytics report
        env:
          # JSON secret: { "refresh_token": "...", "oauth_client_id": "...", "oauth_client_secret": "..." }
          GOOGLE_JSON: ${{ secrets.GOOGLE_JSON }}
          # base64 of "login:password" for DataForSEO (reserved for future use)
          DATAFORSEO_BASE64: ${{ secrets.DATAFORSEO_BASE64 }}
        run: npx tsx pipeline/analyze-properties.ts

      - name: Post report to GitHub Step Summary
        run: |
          DATE=$(date +%Y-%m-%d)
          cat out/analytics-report-${DATE}.md >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report-${{ github.run_id }}
          path: growth/out/analytics-report-*.md
          retention-days: 90
